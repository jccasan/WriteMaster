# Base44 development compose for WriteMaster (Express + Vite-middleware + Prisma/SQLite).
# Single-origin: the Express server integrates Vite in middleware mode and serves
# both the API and the client on one port (mapped to host 3000).
services:
  app:
    image: node:20-bookworm
    working_dir: /app
    volumes:
      # Bind-mount the cloned source so edits appear live (no image rebuilds).
      - ./:/app
      # Keep installed deps in a named volume so they persist across restarts
      # without polluting the host repo.
      - node_modules:/app/node_modules
    ports:
      - "3000:5000"
    environment:
      - NODE_ENV=development
      - PORT=5000
      # Bind-mount file watchers often need polling to fire reliably.
      - CHOKIDAR_USEPOLLING=true
      - WATCHPACK_POLLING=true
    env_file:
      # Placeholders first (app boots without credentials)…
      - ./.env.base44-defaults
      # …platform-managed secrets last, so dashboard values always win.
      - /run/base44/app.env
    command: sh -c "npm install && npx prisma db push && npx tsx watch server/index.ts"
    restart: unless-stopped

volumes:
  node_modules:
