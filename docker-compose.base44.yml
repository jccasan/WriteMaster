# Base44 development compose for WriteMaster (Express + Vite-middleware + Prisma/Postgres).
# Single-origin: the Express server integrates Vite in middleware mode and serves
# both the API and the client on one port (mapped to host 3000).
services:
  db:
    image: postgres:16
    environment:
      # Local infra credentials — generated here, not user secrets.
      POSTGRES_USER: writemaster
      POSTGRES_PASSWORD: writemaster_dev
      POSTGRES_DB: writemaster
    volumes:
      # Persistent database storage — survives container rebuilds.
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U writemaster -d writemaster"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  app:
    image: node:20-bookworm
    working_dir: /app
    depends_on:
      db:
        condition: service_healthy
    volumes:
      # Bind-mount the cloned source so edits appear live (no image rebuilds).
      - ./:/app
      # Keep installed deps in a named volume so they persist across restarts
      # without polluting the host repo.
      - node_modules:/app/node_modules
    ports:
      - "3000:5000"
    environment:
      - NODE_ENV=development
      - PORT=5000
      # Postgres connection (local infra credential, not a user secret).
      - DATABASE_URL=postgresql://writemaster:writemaster_dev@db:5432/writemaster
      # Bind-mount file watchers often need polling to fire reliably.
      - CHOKIDAR_USEPOLLING=true
      - WATCHPACK_POLLING=true
    env_file:
      # Placeholders first (app boots without credentials)…
      - ./.env.base44-defaults
      # …platform-managed secrets last, so dashboard values always win.
      - /run/base44/app.env
    command: sh -c "npm install && npx prisma db push && npx tsx watch server/index.ts"
    restart: unless-stopped

volumes:
  node_modules:
  pgdata:
