<svg xmlns="http://www.w3.org/2000/svg" viewBox="-100 -100 1112 300" width="1112" height="300" role="img" aria-label="James D. May Books">
  <title>James D. May Books — horizontal wordmark (site header, email footer)</title>
  <desc>One line: name, reticle, BOOKS. No rule. Unit grid as the stacked master. Clear space = 100 units, contained in the viewBox.</desc>

  <rect x="-100" y="-100" width="1112" height="300" fill="#102229"/>

  <text x="0" y="100" textLength="572" lengthAdjust="spacing"
        font-family="Druk Condensed, Oswald, Arial Narrow, sans-serif"
        font-weight="600" font-size="137" fill="#EAE7E1">JAMES D. MAY</text>

  <!-- Reticle sits on the cap-height midline (y=50), 40 units clear of the name. -->
  <g stroke="#EAE7E1" stroke-width="2.6" stroke-linecap="butt">
    <circle cx="638" cy="50" r="14.82" fill="none"/>
    <line x1="638" y1="23.9" x2="638" y2="33.88"/>
    <line x1="638" y1="66.12" x2="638" y2="76.1"/>
    <line x1="611.9" y1="50" x2="621.88" y2="50"/>
    <line x1="654.12" y1="50" x2="664.1" y2="50"/>
  </g>
  <circle cx="638" cy="50" r="4.68" fill="#D4141B"/>

  <text x="704" y="100" textLength="308" lengthAdjust="spacing"
        font-family="Druk Condensed, Oswald, Arial Narrow, sans-serif"
        font-weight="600" font-size="137" fill="#EAE7E1">BOOKS</text>
</svg>
