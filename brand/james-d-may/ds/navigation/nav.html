<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Navigation bar &middot; James D. May Books</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Oswald:wght@600;700&amp;family=Inter:wght@400;600&amp;family=Source+Serif+4:ital,wght@0,400;1,400&amp;display=swap">
<style>
:root{
  --ink:#102229; --slate:#1C3743; --fog:#49C2D6; --bone:#EAE7E1;
  --signal:#D4141B; --signal-fill:#C31219; --signal-press:#A51015; --ember:#DD5A1E;
  --hair:rgba(234,231,225,.10); --hair-firm:rgba(234,231,225,.22);
  --muted:rgba(234,231,225,.78); --faint:rgba(234,231,225,.62);
  --paper:#F4F1EA; --paper-ink:#1A1714;
  --disp:"Druk Condensed",Oswald,"Arial Narrow",sans-serif;
  --ui:Inter,-apple-system,"Segoe UI",sans-serif;
  --read:"Source Serif 4",Georgia,"Times New Roman",serif;
}
*{box-sizing:border-box;}
html,body{margin:0;height:100%;}
body{background:var(--ink);color:var(--bone);font-family:var(--ui);
     -webkit-font-smoothing:antialiased;padding:32px;}
a{color:var(--bone);text-decoration:none;border-bottom:1px solid var(--signal);}
a:hover{color:var(--fog);border-bottom-color:var(--fog);}
.lbl{font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--faint);}
.note{font-size:12.5px;line-height:19px;color:var(--faint);margin:14px 0 0;max-width:70ch;}
.row{display:flex;gap:20px;flex-wrap:wrap;}
.st{display:flex;flex-direction:column;gap:9px;align-items:flex-start;}

.btn{font-family:var(--ui);font-weight:600;font-size:14px;letter-spacing:.06em;
     text-transform:uppercase;height:48px;min-width:176px;padding:0 28px;border:0;
     display:inline-flex;align-items:center;justify-content:center;cursor:pointer;border-radius:0;}
.btn-p{background:var(--signal-fill);color:var(--bone);}
.btn-s{background:transparent;color:var(--bone);box-shadow:inset 0 0 0 1px var(--bone);}
</style>
</head>
<body>
<div style="border:1px solid var(--hair);background:var(--ink)"><div style="display:flex;align-items:center;justify-content:space-between;gap:32px;padding:20px 28px"><svg viewBox="0 0 1012 100" width="228" style="display:block" aria-label="James D. May Books"><text x="0" y="100" textLength="572" lengthAdjust="spacing" font-family="Oswald,sans-serif" font-weight="600" font-size="137" fill="#EAE7E1">JAMES D. MAY</text><g transform="translate(638,50) scale(0.52)"><g stroke="#EAE7E1" stroke-width="5" fill="none"><circle cx="0" cy="0" r="28.5"/><line x1="0" y1="-50" x2="0" y2="-31"/><line x1="0" y1="31" x2="0" y2="50"/><line x1="-50" y1="0" x2="-31" y2="0"/><line x1="31" y1="0" x2="50" y2="0"/></g></g><circle cx="638" cy="50" r="4.68" fill="#D4141B"/><text x="704" y="100" textLength="308" lengthAdjust="spacing" font-family="Oswald,sans-serif" font-weight="600" font-size="137" fill="#EAE7E1">BOOKS</text></svg><div style="display:flex;align-items:center;gap:32px"><span style="font-family:var(--ui);font-weight:600;font-size:13px;letter-spacing:.12em;text-transform:uppercase;color:var(--bone);border-bottom:2px solid var(--signal);padding-bottom:3px">Books</span><span style="font-family:var(--ui);font-weight:600;font-size:13px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)">The Author</span><span style="font-family:var(--ui);font-weight:600;font-size:13px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)">Excerpt</span><span style="font-family:var(--ui);font-weight:600;font-size:13px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)">Newsletter</span><button class="btn btn-s" style="min-width:0;height:44px;font-size:12.5px;padding:0 20px" type="button">Preorder</button></div></div></div><p class="note">The active item takes a 2px signal underline, which is this screen's one red, so the Preorder button drops to secondary. The nav marks position or the button asks for the click, never both. The wordmark's centre dot travels with the mark and does not count.</p>
</body>
</html>
