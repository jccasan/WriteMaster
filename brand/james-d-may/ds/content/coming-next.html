<style>
:root{
  --ink:#102229; --slate:#1C3743; --fog:#49C2D6; --bone:#EAE7E1;
  --signal:#D4141B; --signal-fill:#C31219; --signal-press:#A51015; --ember:#DD5A1E;

  --read:"Source Serif 4",Georgia,"Times New Roman",serif;

*{box-sizing:border-box;}

     -webkit-font-smoothing:antialiased;padding:32px;}

<div style="background:var(--slate);border:1px solid var(--hair);padding:20px;display:flex;gap:20px;max-width:560px"><div style="width:153px;height:230px;background:var(--ink);border:1px solid var(--hair);display:flex;align-items:center;justify-content:center;padding:16px;flex:none"><div style="font-family:var(--disp);font-weight:700;font-size:28px;line-height:.96;text-transform:uppercase;letter-spacing:-.01em;text-align:center">Darkwell</div></div><div style="display:flex;flex-direction:column;justify-content:center;flex:1"><div style="font-family:var(--disp);font-weight:600;font-size:32px;line-height:.98;text-transform:uppercase">Darkwell</div><div class="lbl" style="margin-top:8px">Book 2 &middot; Cover to come</div><div style="font-size:13px;line-height:20px;color:var(--muted);margin-top:10px">A dark rectangle and the title in the display face.</div></div></div><p class="note">No invented art, no blurred mockup, no question mark, no "coming soon" badge. An empty rectangle with the real title is honest and it does not age.</p>
